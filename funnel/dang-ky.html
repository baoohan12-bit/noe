<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOE — Đăng ký Workshop Nghệ Thuật Xác Lập Vị Thế</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --wine:   #B84218;
    --wine2:  #C4521A;
    --gold:   #C4521A;
    --gold2:  #E07A40;
    --cream:  #FBF5EE;
    --ivory:  #F5EAD8;
    --parch:  #ECDAC8;
    --ink:    #1E1010;
    --warm:   #3D2010;
    --muted:  #8A6A50;
    --border: rgba(184,66,24,0.14);
    --r:      10px;
  }
  body { font-family:'Cormorant Garamond',serif; background:var(--cream); color:var(--ink); line-height:1.75; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; }
  .card { max-width:480px; width:100%; background:white; border:1px solid var(--border); border-radius:16px; padding:40px 36px; box-shadow:0 8px 32px rgba(184,66,24,0.08); }
  .back-link { display:inline-block; font-family:'Lora',serif; font-size:13px; color:var(--muted); margin-bottom:28px; text-decoration:none; }
  .back-link:hover { color:var(--wine); }
  .back-link::before { content:'← '; }
  .card-badge { font-family:'Lora',serif; font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--wine); border:1px solid var(--wine); padding:5px 14px; border-radius:20px; display:inline-block; margin-bottom:20px; }
  h1 { font-family:'Cormorant Garamond',serif; font-size:30px; font-weight:500; line-height:1.25; margin-bottom:6px; }
  h1 em { color:var(--wine); font-style:italic; }
  .lead { font-family:'Lora',serif; font-size:14px; color:var(--muted); margin-bottom:28px; font-style:italic; }
  .divider { width:40px; height:2px; background:var(--gold); margin:0 0 28px; }
  .summary-box { background:var(--ivory); border:1px solid var(--border); border-radius:var(--r); padding:14px 18px; margin-bottom:28px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .summary-name { font-size:14px; font-weight:600; color:var(--ink); }
  .summary-price { font-family:'Lora',serif; font-size:20px; font-weight:600; color:var(--wine); }
  label { display:block; font-family:'Lora',serif; font-size:13px; font-weight:600; letter-spacing:.04em; color:var(--warm); margin:16px 0 6px; }
  input, select { width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:6px; font-family:'Cormorant Garamond',serif; font-size:16px; color:var(--ink); background:white; transition:border-color .2s; }
  input:focus, select:focus { outline:none; border-color:var(--wine); box-shadow:0 0 0 3px rgba(184,66,24,.08); }
  .cta-btn { width:100%; background:var(--wine); color:white; font-family:'Lora',serif; font-weight:700; font-size:16px; padding:16px; border:none; border-radius:6px; cursor:pointer; margin-top:24px; letter-spacing:.03em; transition:background .2s; }
  .cta-btn:hover { background:var(--wine2); }
  .cta-btn:disabled { background:var(--muted); cursor:not-allowed; }
  .cta-note { font-size:13px; color:var(--muted); text-align:center; margin-top:10px; font-family:'Lora',serif; font-style:italic; }
  .error { color:var(--wine); font-family:'Lora',serif; font-size:13px; margin-top:10px; display:none; }
</style>
</head>
<body>
<div class="card">
  <a href="/" class="back-link">Quay lại trang workshop</a>
  <div class="card-badge">Workshop · NOE</div>
  <h1>Đăng ký tham gia<br><em>Nghệ Thuật Xác Lập Vị Thế</em></h1>
  <p class="lead">Điền thông tin để tiếp tục đến trang thanh toán.</p>
  <div class="divider"></div>

  <div class="summary-box">
    <span class="summary-name">Workshop Nghệ Thuật Xác Lập Vị Thế</span>
    <span class="summary-price">97.000đ</span>
  </div>

  <form id="orderForm">
    <label>Họ và tên *</label>
    <input type="text" name="name" placeholder="Nguyễn Văn A" required>

    <label>Số điện thoại *</label>
    <input type="tel" name="phone" placeholder="09xxxxxxxx" required pattern="[0-9]{10,11}">

    <label>Email *</label>
    <input type="email" name="email" placeholder="email@cua-ban.com" required>

    <label>Điều bạn muốn đạt được sau workshop</label>
    <select name="goal">
      <option value="">— Chọn mục tiêu —</option>
      <option value="Xác lập vị thế chuyên gia">Xác lập vị thế chuyên gia trong ngành</option>
      <option value="Thu hút khách hàng lý tưởng">Thu hút khách hàng lý tưởng, ngừng chạy theo giá</option>
      <option value="Tự tin về giá trị bản thân">Tự tin về giá trị bản thân, nói chuyện với khách</option>
      <option value="Khác">Mục tiêu khác</option>
    </select>

    <button type="submit" class="cta-btn" id="submitBtn">Tiếp tục thanh toán →</button>
    <p class="error" id="error"></p>
  </form>
  <p class="cta-note">🔒 Thông tin của bạn được bảo mật tuyệt đối</p>
</div>

<script>
  const GAS_URL = '__GAS_URL__';

  document.getElementById('orderForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errEl = document.getElementById('error');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Đang xử lý...';

    const form = new FormData(e.target);
    const data = {
      name: form.get('name'),
      phone: form.get('phone'),
      email: form.get('email'),
      goal: form.get('goal'),
      bump1: false,
      bump2: false,
      totalAmount: 97000
    };

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'createOrder', data: data })
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.error || 'Tạo đơn thất bại');

      sessionStorage.setItem('order', JSON.stringify({
        orderId: json.orderId,
        ckContent: json.ckContent,
        totalAmount: json.totalAmount,
        name: data.name,
        email: data.email,
        phone: data.phone,
        goal: data.goal
      }));

      window.location.href = '/checkout';
    } catch (err) {
      errEl.textContent = 'Lỗi: ' + err.message + '. Vui lòng thử lại.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Tiếp tục thanh toán →';
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOE Workshop — Đăng ký</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #222; line-height: 1.6; padding: 40px 20px; }
  .container { max-width: 480px; margin: 0 auto; background: #fff; padding: 32px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  h1 { font-size: 24px; margin-bottom: 8px; }
  .lead { color: #666; margin-bottom: 24px; font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
  input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 15px; }
  input:focus, select:focus { outline: none; border-color: #c0392b; }
  .cta { width: 100%; background: #c0392b; color: #fff; padding: 14px; font-size: 16px; font-weight: 700; border: none; border-radius: 4px; cursor: pointer; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; }
  .cta:hover { background: #a93226; }
  .cta:disabled { background: #999; cursor: not-allowed; }
  .error { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>Đăng ký Workshop Nghệ Thuật Xác Lập Vị Thế</h1>
  <p class="lead">Điền thông tin để tiếp tục đến trang thanh toán.</p>

  <form id="orderForm">
    <label>Họ tên *</label>
    <input type="text" name="name" required>

    <label>Số điện thoại *</label>
    <input type="tel" name="phone" required pattern="[0-9]{10,11}">

    <label>Email *</label>
    <input type="email" name="email" required>

    <label>Mục tiêu của bạn</label>
    <select name="goal">
      <option value="">-- Chọn mục tiêu --</option>
      <option value="Mục tiêu A">Mục tiêu A</option>
      <option value="Mục tiêu B">Mục tiêu B</option>
      <option value="Mục tiêu C">Mục tiêu C</option>
    </select>

    <button type="submit" class="cta" id="submitBtn">Tiếp tục thanh toán →</button>
    <p class="error" id="error"></p>
  </form>
</div>

<script>
  const GAS_URL = '__GAS_URL__';

  document.getElementById('orderForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errEl = document.getElementById('error');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Đang xử lý...';

    const form = new FormData(e.target);
    const data = {
      name: form.get('name'),
      phone: form.get('phone'),
      email: form.get('email'),
      goal: form.get('goal'),
      bump1: false,
      bump2: false,
      totalAmount: 99000
    };

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'createOrder', data: data })
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.error || 'Order creation failed');

      sessionStorage.setItem('order', JSON.stringify({
        orderId: json.orderId,
        ckContent: json.ckContent,
        totalAmount: json.totalAmount,
        name: data.name,
        email: data.email,
        phone: data.phone,
        goal: data.goal
      }));

      window.location.href = '/checkout';
    } catch (err) {
      errEl.textContent = 'Lỗi: ' + err.message + '. Vui lòng thử lại.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Tiếp tục thanh toán →';
    }
  });
</script>
</body>
</html>
